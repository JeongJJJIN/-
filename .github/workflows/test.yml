name: 테스트

on:
  push:
    paths-ignore:
      - "data/**"
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: 설정 파일 검증
        run: python3 -c "from teukbo.config import load_config; c = load_config(); print(len(c.regions), '개 지역,', len(c.thresholds.hazards), '개 특보 기준')"
      - name: 단위 테스트
        run: python3 -m unittest discover -s tests -t . -v
      - name: 화면 스크립트 문법 검사
        run: node --check web/app.js && node --check web/rail.js && node --check web/sw.js

  sources:
    name: 출처 점검 (참고용, 실패해도 무시)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: 각 출처에 실제로 접속해 응답 확인
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
        run: python3 -m teukbo.check

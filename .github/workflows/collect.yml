name: 수집·계산·배포

# 3시간마다: 예보 수집 → 가능성 계산 → 이력 커밋 → GitHub Pages 배포
# 예약 실행은 기본 브랜치(main)에서만 동작합니다.
# GitHub 의 예약은 한 시간 넘게 늦거나 아예 빠지는 일이 있어, 예약은 30분마다 걸고 실제 수집은 '정해진 시각이 지났는데
# 아직 그 회차를 돌리지 않았을 때'만 한다(teukbo/schedule.py). 때가 아니면 아무 자료도 받지 않고 몇 초 만에 끝난다.
# 예약이 몇 시간씩 오지 않는 때를 대비해, 실시간 수집(live.yml)도 돌 때마다 같은 판단을 해서 밀렸으면 이 워크플로를 시작시킨다.

on:
  schedule:
    # 정해진 시각: 기상청 단기예보 발표(02·05·08·11·14·17·20·23시 KST, 발표 10분 뒤 제공) 약 25분 뒤
    # — config/settings.json 의 local.trigger.collect_utc_hours·collect_minute 에 있다.
    # 예약은 매시 25분·55분: 25분 예약이 제시간에 오면 그때 돌고, 늦거나 빠지면 다음 예약이 따라잡는다.
    - cron: "25,55 * * * *"
  workflow_dispatch:
    inputs:
      if_due:
        description: "자동 신호용 — 정해진 시각이 지났고 아직 그 회차를 돌리지 않았을 때만 돈다. 직접 돌릴 때는 꺼 두세요(끄면 바로 돌립니다)."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "web/**"
      - "teukbo/**"
      - "config/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write # data/history 이력 커밋
  pages: write # GitHub Pages 배포
  id-token: write

# 동시에 두 번 돌지 않게 한다(이력 커밋 충돌 방지). 진행 중인 실행은 끝까지 둔다.
concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  collect:
    name: 수집·계산
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.due.outputs.run }}
    steps:
      # 이 실행을 일으킨 시점의 커밋이 아니라 지금의 최신 커밋을 받는다: 앞의 실행이 끝나기를 기다리는 동안 그 실행이 이력을
      # 커밋하므로, 옛 커밋에서 시작하면 이력 파일이 서로 달라져 push 가 충돌한다(2026-11-13 에 실제로 실패함).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      # 실시간 수집(live.yml)이 '밀렸다'고 보고 보낸 신호(if_due)도 여기서 한 번 더 확인한다: 같은 회차를 두 번 계산하지 않는다.
      - name: 지금 돌릴 때인지 확인 (예약 실행·자동 신호일 때만 — 직접 실행·코드 변경은 늘 돈다)
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.if_due }}" = "true" ]; then
            python3 -m teukbo.schedule
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집·계산 (표준 라이브러리만 사용 — 설치할 패키지 없음)
        if: ${{ steps.due.outputs.run == 'true' }}
        env:
          # 인증키는 저장소 Settings → Secrets and variables → Actions 에 등록합니다. 없으면 해당 출처만 건너뜁니다.
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          # 화면이 실시간 자료(live.yml 이 만드는 live.json)를 읽어 올 주소 — 인증키가 아니다
          TEUKBO_LIVE_URL: https://raw.githubusercontent.com/${{ github.repository }}/live/live.json
        run: python3 -m teukbo.run

      - name: 열차 운행 기록 집계 (전날까지의 코레일 공식 기록 × 특보)
        if: ${{ steps.due.outputs.run == 'true' }}
        # 철도 통계가 실패해도 기상 수집·배포는 계속한다. 한 번에 며칠씩만 받아 과거 기록을 차례로 채운다.
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python3 -m teukbo.rail_run

      - name: 이력 커밋
        if: ${{ steps.due.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/accuracy.json
          if [ -d data/rail ]; then git add data/rail; fi
          if git diff --cached --quiet; then
            echo "커밋할 변경이 없습니다."
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 수집"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push 실패 — 원격 변경을 받아 다시 시도합니다 (${attempt}/4)"
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "::error::이력을 push 하지 못했습니다."
          exit 1

      - name: 사이트 조립 (web/ + 최신 결과)
        if: ${{ steps.due.outputs.run == 'true' }}
        run: python3 -m teukbo.site --out _site

      - uses: actions/upload-pages-artifact@v4
        if: ${{ steps.due.outputs.run == 'true' }}
        with:
          path: _site

  deploy:
    name: GitHub Pages 배포
    needs: collect
    if: ${{ needs.collect.outputs.ran == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

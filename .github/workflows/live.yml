name: 실시간 자료 (특보·지금 날씨)

# 몇 분마다: 특보·예비특보, 초단기실황, 초단기예보를 받아 live.json 하나로 묶어 `live` 브랜치에 올린다.
# 화면은 그 파일을 https://raw.githubusercontent.com/<저장소>/live/live.json 에서 읽는다(사이트를 다시 배포하지 않는다).
# - GitHub 의 예약 실행은 가장 짧아야 5분 간격이고, 사정에 따라 더 늦게 시작될 수 있다(보장되지 않음).
# - 위 주소는 GitHub 쪽에서 최대 5분 동안 같은 내용을 돌려준다. → 화면에 반영되기까지 보통 5~10분.
# - 화면은 '확인 시각'을 보고, 오래된 값은 쓰지 않고 지연을 알린다(config/settings.json 의 live.stale_after_minutes).
# - GitHub 의 예약은 몇 시간씩 오지 않을 때가 있다(2026-11-13: 18시간 동안 3번). 제때 돌리려면 바깥 시계가 5분마다
#   이 워크플로에 '실행' 신호를 보내게 한다 — tools/cloud_clock.gs (README '공개 사이트를 제때 갱신하게 하기').
# - 끝에서 3시간 주기의 수집·계산이 밀렸는지 보고, 밀렸으면 시작시킨다(teukbo/schedule.py). 그래서 바깥 시계는 이 워크플로 하나만 깨우면 된다.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write # live 브랜치에 올리기
  actions: write # 밀린 수집·계산(collect.yml) 시작시키기

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  live:
    name: 실시간 수집
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: 직전 실시간 자료 받기 (조회 간격 판단·실패 시 이어 쓰기용)
        run: |
          mkdir -p _prev
          if git fetch --quiet --depth=1 origin live 2>/dev/null; then
            git show FETCH_HEAD:live.json > _prev/live.json || rm -f _prev/live.json
            git show FETCH_HEAD:state.json > _prev/state.json 2>/dev/null || rm -f _prev/state.json
          else
            echo "live 브랜치가 아직 없습니다(첫 실행)."
          fi

      - name: 수집 (표준 라이브러리만 사용)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
        run: python3 -m teukbo.live --prev _prev/live.json --state _prev/state.json --out _live/live.json --state-out _live/state.json

      - name: live 브랜치에 올리기 (기록을 쌓지 않고 최신 한 벌만 둔다)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd _live
          cat > README.md <<'TXT'
          이 브랜치는 자동으로 만들어집니다(직접 고치지 마세요).
          live.json — 몇 분마다 새로 만들어지는 실시간 자료(특보·예비특보, 지금 날씨, 앞으로 6시간, 선로 강우). 만드는 곳: main 브랜치의 .github/workflows/live.yml
          state.json — 다음 실행이 이어 쓰는 상태(레이더 최근 1시간 값). 화면은 읽지 않는다.
          TXT
          git init --quiet --initial-branch=live .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json README.md
          if [ -f state.json ]; then git add state.json; fi
          git commit --quiet -m "live: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for attempt in 1 2 3; do
            if git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live; then exit 0; fi
            echo "push 실패 — 다시 시도합니다 (${attempt}/3)"
            sleep $((attempt * 4))
          done
          echo "::error::실시간 자료를 올리지 못했습니다."
          exit 1

      # 실시간 수집이 실패했어도 본다. 이 단계의 실패는 무시한다(다음 차례에 다시 본다).
      - name: 3시간 주기의 수집·계산이 밀렸으면 시작시키기
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m teukbo.schedule --start-collect

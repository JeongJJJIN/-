<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기상특보 가능성</title>
  <meta name="description" content="지역을 고르면 앞으로 48시간 안에 기상특보가 내려질 가능성을 보여 줍니다. 참고용이며 공식 특보·예비특보가 우선합니다.">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body class="home">
  <div class="notice" role="note">
    <svg class="notice-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17L10 2.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="currentColor"/></svg>
    <span>참고용입니다. 공식 특보·예비특보가 우선합니다.</span>
  </div>

  <header class="masthead">
    <div class="wrap">
      <div class="title-row">
        <h1>기상특보 가능성</h1>
        <p class="updated" id="updated" aria-live="polite">불러오는 중…</p>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="alerts"></div>

    <section class="finder" aria-label="지역 찾기">
      <label class="finder-label" for="q">지역</label>
      <input type="search" id="q" class="finder-input" placeholder="지역 이름을 입력하세요 (예: 순천)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <div class="finder-matches" id="matches" role="group" aria-label="찾은 지역"></div>
    </section>

    <section id="result" aria-live="polite" aria-label="고른 지역의 특보 가능성"></section>

    <section class="home-map" aria-label="지역별 특보 가능성 지도">
      <div id="map"></div>
      <ul class="legend" id="legend"></ul>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>가능성은 여러 예보(기상청 단기예보·ECMWF·GFS·ICON·JMA)가 앞으로 48시간 안에 특보 기준을 넘기는 정도를 점수로 만든 <strong>참고값</strong>입니다. 실제 특보는 <a href="https://www.weather.go.kr/w/special-report/overall.do" rel="noopener">기상청 날씨누리의 공식 특보·예비특보</a>를 확인하세요.</p>
      <p class="credits">기상자료: 기상청(공공데이터포털·API허브) · <a href="https://open-meteo.com/" rel="noopener">Weather data by Open-Meteo.com</a> (<a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a>, 가공하여 사용)</p>
    </div>
  </footer>

  <noscript><p class="noscript">이 페이지는 자바스크립트가 필요합니다.</p></noscript>
  <script src="ui.js?v=__BUILD__" defer></script>
  <script src="live.js?v=__BUILD__" defer></script>
  <script src="home.js?v=__BUILD__" defer></script>
</body>
</html>
